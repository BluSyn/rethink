[workspace]
resolver = "2"
members = [
    "crates/rethink-util",
    "crates/rethink-core",
    "crates/rethink-devices",
    "crates/rethink-bridge",
    "crates/rethink-cloud",
    "crates/rethink-setup",
    "crates/rethink-tools",
]
default-members = [
    "crates/rethink-util",
    "crates/rethink-core",
    "crates/rethink-devices",
    "crates/rethink-bridge",
    "crates/rethink-cloud",
    "crates/rethink-setup",
    "crates/rethink-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/anszom/rethink"

[workspace.dependencies]
rethink-util = { path = "crates/rethink-util" }
rethink-core = { path = "crates/rethink-core" }
rethink-devices = { path = "crates/rethink-devices" }
rethink-bridge = { path = "crates/rethink-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
base64 = "0.22"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
rcgen = "0.13"
rumqttc = "0.24"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hmac = "0.12"
url = "2"
include_dir = "0.7"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
tower = "0.5"
http-body-util = "0.1"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
webpki-roots = "0.26"
