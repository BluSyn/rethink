# Rethink — MQTT event entity notification
#
# Use for one-shot notifications:
#   - event.*_cycle_complete     (dryer finished)
#   - event.*_bucket_alert       (bucket_full / bucket_ok)
#   - event.*_filter_changed     (filter just became exhausted)
#
# Install:
#   1. Copy this file to config/blueprints/automation/rethink/
#   2. Reload automations or restart HA
#   3. Settings → Automations → Create → Blueprints → pick this blueprint
#
blueprint:
  name: Rethink — Event notification
  description: >
    Send a notification when one or more rethink event entities fire
    (cycle complete, bucket alert, filter alert). Optional filter on
    event_type. Multi-select entities to cover several appliances.
  domain: automation
  source_url: https://github.com/anszom/rethink/blob/rust-rewrite/docs/homeassistant/blueprints/rethink_event_notify.yaml
  author: rethink
  homeassistant:
    min_version: "2023.8.0"
  input:
    event_entity:
      name: Event entity(ies)
      description: >
        One or more rethink event entities (Cycle complete, Bucket alert,
        Filter alert). Multi-select supported.
      selector:
        entity:
          domain: event
          multiple: true
    event_type_filter:
      name: Event type filter (optional)
      description: >
        Leave empty to notify on any event from these entities. Set to a
        specific type to filter, e.g. cycle_complete, bucket_full,
        bucket_ok, filter_needs_change.
      default: ""
      selector:
        text:
    notify_service:
      name: Notify service
      description: >
        Full service name, e.g. notify.notify or notify.mobile_app_phone.
      default: notify.notify
      selector:
        text:
    title:
      name: Notification title
      default: Appliance event
      selector:
        text:
    message:
      name: Notification message
      description: >
        Jinja template. trigger.to_state is the event entity that fired.
      default: >-
        {{ trigger.to_state.attributes.friendly_name
           | default(trigger.to_state.name, true)
           | default(trigger.entity_id) }}:
        {{ trigger.to_state.attributes.event_type | default('event') }}
      selector:
        text:
          multiline: true

mode: queued
max: 20
max_exceeded: silent

variables:
  event_type_filter: !input event_type_filter

trigger:
  - platform: state
    entity_id: !input event_entity

condition:
  # Ignore unavailable/unknown transitions
  - condition: template
    value_template: >-
      {{ trigger.to_state is defined
         and trigger.to_state.state not in ['unavailable', 'unknown', none] }}
  # Optional event_type filter (empty = any)
  - condition: template
    value_template: >-
      {% set filt = event_type_filter | default('', true) | trim %}
      {% set et = trigger.to_state.attributes.event_type | default('') %}
      {{ filt == '' or et == filt }}

action:
  - service: !input notify_service
    data:
      title: !input title
      message: !input message
