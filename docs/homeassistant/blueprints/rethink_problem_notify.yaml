# Rethink — problem binary_sensor notification
#
# Use for sticky conditions that stay ON until cleared:
#   - binary_sensor.*_filter_needs_change  (AC filter)
#   - binary_sensor.*_bucket_full          (dehumidifier)
#
# Install:
#   1. Copy this file to config/blueprints/automation/rethink/
#   2. Developer Tools → YAML → Reload automations (or restart HA)
#   3. Settings → Automations → Create → Blueprints → pick this blueprint
#
blueprint:
  name: Rethink — Problem sensor notification
  description: >
    Send a notification when one or more rethink problem binary_sensors
    turn on (filter needs change, bucket full, etc.). Fires only on the
    rising edge (off → on). Select multiple entities to cover several
    appliances with one automation.
  domain: automation
  source_url: https://github.com/anszom/rethink/blob/rust-rewrite/docs/homeassistant/blueprints/rethink_problem_notify.yaml
  author: rethink
  homeassistant:
    min_version: "2023.8.0"
  input:
    problem_entity:
      name: Problem sensor(s)
      description: >
        One or more rethink binary_sensors with device class Problem
        (e.g. Filter needs change, Bucket full). Multi-select supported.
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - problem
          multiple: true
    notify_service:
      name: Notify service
      description: >
        Service to call, e.g. notify.notify, notify.mobile_app_phone, or
        notify.persistent_notification.
      default: notify.notify
      selector:
        text:
    title:
      name: Notification title
      default: Appliance alert
      selector:
        text:
    message:
      name: Notification message
      description: >
        Jinja template. Use trigger.to_state for the sensor that fired
        (works with multi-entity). Leave default for device-friendly name.
      default: >-
        {{ trigger.to_state.attributes.friendly_name
           | default(trigger.to_state.name, true)
           | default(trigger.entity_id) }} is ON
      selector:
        text:
          multiline: true

mode: queued
max: 20
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input problem_entity
    from: "off"
    to: "on"

condition: []

action:
  - service: !input notify_service
    data:
      title: !input title
      message: !input message
