name: CI

on:
    push:
        branches:
            - master
            - rust-rewrite
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    rust:
        name: cargo test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2

            - name: Build
              run: cargo build -p rethink-util -p rethink-core -p rethink-devices -p rethink-bridge -p rethink-cloud -p rethink-setup -p rethink-tools

            - name: Test
              run: cargo test --workspace -- --nocapture
