name: CI

on:
    push:
        branches:
            - master
            - rust-rewrite
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    rust:
        name: cargo test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2

            - name: Build
              run: cargo build -p rethink-util -p rethink-core -p rethink-devices -p rethink-bridge -p rethink-cloud -p rethink-setup -p rethink-tools

            - name: Test
              run: cargo test --workspace -- --nocapture

    # Optional: keep TypeScript checks while the port is in progress
    node:
        name: Node ${{ matrix.node-version }} (legacy)
        runs-on: ubuntu-latest
        if: false # disable until/unless npm path is still maintained

        strategy:
            fail-fast: false
            matrix:
                node-version: [20, 24]

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Test
              run: npm run test
